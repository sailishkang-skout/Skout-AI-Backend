# Backend local stack — API, AI, Postgres, Redis
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Frontend runs separately from Skout Ai Frontend repo:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

networks:
  default:
    name: skout-local

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://skout:skout@postgres:5432/skout
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      AI_SERVICE_URL: http://ai:8000
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://host.docker.internal:9200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
