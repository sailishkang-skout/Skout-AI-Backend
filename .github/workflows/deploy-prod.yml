name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENV_NAME: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Environment
        run: |
          echo "GitHub environment: ${{ github.environment }}"
          echo "ENV_NAME: ${{ env.ENV_NAME }}"
          echo "AWS_REGION: ${{ env.AWS_REGION }}"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=prod-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Install CDK dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Ensure ECR repositories (Registry stack)
        working-directory: infra
        run: pnpm cdk deploy SkoutProd-Registry -c env=prod --require-approval never

      - name: Build and push API image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          API_REPO=$(aws ecr describe-repositories --repository-names skout-prod-api --query 'repositories[0].repositoryUri' --output text)
          docker build -f apps/api/Dockerfile -t "$API_REPO:$IMAGE_TAG" -t "$API_REPO:latest" .
          docker push "$API_REPO:$IMAGE_TAG"
          docker push "$API_REPO:latest"

      - name: Build and push CRM image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          CRM_REPO=$(aws ecr describe-repositories --repository-names skout-prod-crm --query 'repositories[0].repositoryUri' --output text)
          docker build -f apps/crm/Dockerfile -t "$CRM_REPO:$IMAGE_TAG" -t "$CRM_REPO:latest" .
          docker push "$CRM_REPO:$IMAGE_TAG"
          docker push "$CRM_REPO:latest"

      - name: Build and push AI image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          AI_REPO=$(aws ecr describe-repositories --repository-names skout-prod-ai --query 'repositories[0].repositoryUri' --output text)
          docker build -f apps/ai/Dockerfile -t "$AI_REPO:$IMAGE_TAG" -t "$AI_REPO:latest" apps/ai
          docker push "$AI_REPO:$IMAGE_TAG"
          docker push "$AI_REPO:latest"

      - name: Build and push scraper worker images
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          build_scraper() {
            local subpath="$1"
            local package="$2"
            local repo_name="$3"
            local repo
            repo=$(aws ecr describe-repositories --repository-names "$repo_name" --query 'repositories[0].repositoryUri' --output text)
            docker build --platform linux/amd64 -f workers/scrapers/Dockerfile \
              --build-arg WORKER_SUBPATH="$subpath" \
              --build-arg WORKER_PACKAGE="$package" \
              -t "${repo}:${IMAGE_TAG}" -t "${repo}:latest" .
            docker push "${repo}:${IMAGE_TAG}"
            docker push "${repo}:latest"
          }
          build_scraper orchestrator @skout/scraper-orchestrator skout-prod-scraper-orchestrator
          build_scraper cleaner @skout/scraper-cleaner skout-prod-scraper-cleaner
          build_scraper ingestor @skout/scraper-ingestor skout-prod-scraper-ingestor

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Skout-AI-Frontend
          ref: main
          path: frontend
        continue-on-error: true

      - name: Build and push Web image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          API_URL: ${{ vars.PROD_API_URL }}
        run: |
          if [ ! -f frontend/package.json ] || [ ! -f frontend/Dockerfile ]; then
            echo "Frontend repo or Dockerfile not found — skipping web image build"
            exit 0
          fi
          WEB_REPO=$(aws ecr describe-repositories --repository-names skout-prod-web --query 'repositories[0].repositoryUri' --output text)
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="${API_URL}" \
            --build-arg NEXT_PUBLIC_APP_URL="https://www.skoutai.io/app" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY }}" \
            -t "$WEB_REPO:$IMAGE_TAG" -t "$WEB_REPO:latest" frontend
          docker push "$WEB_REPO:$IMAGE_TAG"
          docker push "$WEB_REPO:latest"

      - name: Deploy CDK stacks
        working-directory: infra
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: pnpm cdk deploy --all -c env=prod -c imageTag=$IMAGE_TAG -c httpsMode=cloudfront --require-approval never

      - name: Run database migrations (ECS one-off task)
        run: bash scripts/ecs-run-migrations.sh SkoutProd

      - name: Force ECS redeploy
        run: |
          CLUSTER=$(aws ecs list-clusters --query "clusterArns[?contains(@, 'SkoutProd')]" --output text)
          for svc in api crm ai web scraper-orchestrator scraper-cleaner scraper-ingestor; do
            aws ecs update-service --cluster "$CLUSTER" --service "$svc" --force-new-deployment || true
          done
