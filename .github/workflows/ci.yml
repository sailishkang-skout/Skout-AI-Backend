name: CI

on:
  push:
    branches: [main, develop, uat]
  pull_request:
    branches: [main, develop, uat]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skout
          POSTGRES_PASSWORD: skout
          POSTGRES_DB: skout
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://skout:skout@localhost:5432/skout
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build workspace packages (API dependencies)
        run: pnpm --filter @skout/api^... build

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API
        run: pnpm --filter @skout/api build

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-build
    strategy:
      matrix:
        service: [api, ai]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: |
          if [ "${{ matrix.service }}" = "api" ]; then
            docker build -f apps/api/Dockerfile -t skout-${{ matrix.service }}:ci .
          else
            docker build -f apps/ai/Dockerfile -t skout-${{ matrix.service }}:ci apps/ai
          fi

  cdk-synth:
    runs-on: ubuntu-latest
    needs: test-and-build
    strategy:
      matrix:
        env: [local, dev, uat, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install infra dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile || pnpm install

      - name: CDK synth (${{ matrix.env }})
        working-directory: infra
        run: pnpm synth:${{ matrix.env }}
