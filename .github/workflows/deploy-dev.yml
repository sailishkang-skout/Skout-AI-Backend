name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ENV_NAME: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Environment
        run: |
          echo "GitHub environment: ${{ github.environment }}"
          echo "ENV_NAME: ${{ env.ENV_NAME }}"
          echo "AWS_REGION: ${{ env.AWS_REGION }}"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Install CDK dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Ensure ECR repositories (Registry stack)
        working-directory: infra
        run: pnpm cdk deploy SkoutDev-Registry -c env=dev --require-approval never

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          API_REPO=$(aws ecr describe-repositories --repository-names skout-dev-api --query 'repositories[0].repositoryUri' --output text)
          docker build -f apps/api/Dockerfile -t "$API_REPO:$IMAGE_TAG" -t "$API_REPO:latest" .
          docker push "$API_REPO:$IMAGE_TAG"
          docker push "$API_REPO:latest"

      - name: Build and push CRM image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          CRM_REPO=$(aws ecr describe-repositories --repository-names skout-dev-crm --query 'repositories[0].repositoryUri' --output text)
          docker build -f apps/crm/Dockerfile -t "$CRM_REPO:$IMAGE_TAG" -t "$CRM_REPO:latest" .
          docker push "$CRM_REPO:$IMAGE_TAG"
          docker push "$CRM_REPO:latest"

      - name: Build and push AI image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          AI_REPO=$(aws ecr describe-repositories --repository-names skout-dev-ai --query 'repositories[0].repositoryUri' --output text)
          docker build -f apps/ai/Dockerfile -t "$AI_REPO:$IMAGE_TAG" -t "$AI_REPO:latest" apps/ai
          docker push "$AI_REPO:$IMAGE_TAG"
          docker push "$AI_REPO:latest"

      - name: Build and push scraper worker images
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          build_scraper() {
            local subpath="$1"
            local package="$2"
            local repo_name="$3"
            local repo
            repo=$(aws ecr describe-repositories --repository-names "$repo_name" --query 'repositories[0].repositoryUri' --output text)
            docker build --platform linux/amd64 -f workers/scrapers/Dockerfile \
              --build-arg WORKER_SUBPATH="$subpath" \
              --build-arg WORKER_PACKAGE="$package" \
              -t "${repo}:${IMAGE_TAG}" -t "${repo}:latest" .
            docker push "${repo}:${IMAGE_TAG}"
            docker push "${repo}:latest"
          }
          build_scraper orchestrator @skout/scraper-orchestrator skout-dev-scraper-orchestrator
          build_scraper cleaner @skout/scraper-cleaner skout-dev-scraper-cleaner
          build_scraper ingestor @skout/scraper-ingestor skout-dev-scraper-ingestor

      - name: Checkout Email Intelligence Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Skout-Email-Intelligence-Tool
          ref: main
          path: email-intel

      - name: Build and push Email Intelligence image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          EMAIL_INTEL_REPO=$(aws ecr describe-repositories --repository-names skout-dev-email-intel --query 'repositories[0].repositoryUri' --output text)
          docker build -f email-intel/Dockerfile -t "$EMAIL_INTEL_REPO:$IMAGE_TAG" -t "$EMAIL_INTEL_REPO:latest" email-intel
          docker push "$EMAIL_INTEL_REPO:$IMAGE_TAG"
          docker push "$EMAIL_INTEL_REPO:latest"

      - name: Checkout Warm-Up Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Skout-Warm-Up-Tool
          ref: main
          path: warmup-tool
        continue-on-error: true

      - name: Build and push Warm-Up Tool image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ ! -f warmup-tool/Dockerfile ]; then
            echo "::warning::Warm-Up Tool checkout missing Dockerfile — skipping image build"
            exit 0
          fi
          WARMUP_REPO=$(aws ecr describe-repositories --repository-names skout-dev-warmup-tool --query 'repositories[0].repositoryUri' --output text)
          docker build -f warmup-tool/Dockerfile -t "$WARMUP_REPO:$IMAGE_TAG" -t "$WARMUP_REPO:latest" warmup-tool
          docker push "$WARMUP_REPO:$IMAGE_TAG"
          docker push "$WARMUP_REPO:latest"

      - name: Checkout frontend
        id: checkout_frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Skout-AI-Frontend
          ref: develop
          path: frontend
        continue-on-error: true

      - name: Resolve dev public URL for web build
        id: weburl
        run: |
          WEB_URL=$(aws cloudformation describe-stacks --stack-name SkoutDev-Compute \
            --query "Stacks[0].Outputs[?OutputKey=='WebUrl'].OutputValue" --output text 2>/dev/null || true)
          WEB_URL="${WEB_URL%/}"
          if [ -z "$WEB_URL" ] || [ "$WEB_URL" = "None" ]; then
            WEB_URL="${{ vars.DEV_WEB_URL }}"
            WEB_URL="${WEB_URL%/}"
          fi
          if [ -z "$WEB_URL" ]; then
            WEB_URL="${{ vars.DEV_API_URL }}"
            WEB_URL="${WEB_URL%/}"
          fi
          if echo "$WEB_URL" | grep -qi '\.elb\.amazonaws\.com'; then
            echo "::error::Web build URL must be the HTTPS API Gateway URL (WebUrl output), not the ALB."
            exit 1
          fi
          if [ -z "$WEB_URL" ]; then
            WEB_URL="http://localhost:3001"
          fi
          echo "url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "Using web build URL: $WEB_URL"

      - name: Build and push Web image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          WEB_URL: ${{ steps.weburl.outputs.url }}
        run: |
          if [ ! -f frontend/package.json ] || [ ! -f frontend/Dockerfile ]; then
            echo "::error::Checkout frontend step outcome was '${{ steps.checkout_frontend.outcome }}' (conclusion '${{ steps.checkout_frontend.conclusion }}') and frontend/package.json or frontend/Dockerfile is missing — web image will NOT be rebuilt this run, and the web service will keep running whatever was last successfully deployed. This used to fail silently (continue-on-error swallowed the real checkout error) — check the 'Checkout frontend' step's own logs above for the actual failure."
            exit 0
          fi
          WEB_REPO=$(aws ecr describe-repositories --repository-names skout-dev-web --query 'repositories[0].repositoryUri' --output text)
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="${WEB_URL}" \
            --build-arg NEXT_PUBLIC_APP_URL="https://www.skoutai.io/app" \
            --build-arg NEXT_PUBLIC_CRM_API_URL="${WEB_URL}" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY }}" \
            --build-arg GATE_TOKEN="${{ secrets.GATE_TOKEN }}" \
            -t "$WEB_REPO:$IMAGE_TAG" -t "$WEB_REPO:latest" frontend
          docker push "$WEB_REPO:$IMAGE_TAG"
          docker push "$WEB_REPO:latest"

      # Deploy core stacks first (excludes WarmupTool). Warm-Up is soft-failed
      # until MICROSOFT_CLIENT_* exist in SkoutDev/warmup-tool and CI passes
      # -c warmupMicrosoftOAuth=true.
      - name: Deploy CDK stacks
        working-directory: infra
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          CTX=(-c env=dev -c "imageTag=${IMAGE_TAG}" -c httpsMode=apigateway)
          echo "Deploying core stacks (excluding WarmupTool)…"
          pnpm exec cdk deploy \
            SkoutDev-Network \
            SkoutDev-Data \
            SkoutDev-Registry \
            SkoutDev-Compute \
            SkoutDev-Workers \
            SkoutDev-EmailIntel \
            SkoutDev-Observability \
            "${CTX[@]}" \
            --require-approval never
          echo "Deploying WarmupTool (soft-fail)…"
          if ! pnpm exec cdk deploy SkoutDev-WarmupTool "${CTX[@]}" --require-approval never; then
            echo "::warning::SkoutDev-WarmupTool CDK deploy failed — core API/web/CRM already deployed. Add MICROSOFT_CLIENT_ID/SECRET to SkoutDev/warmup-tool, then redeploy with -c warmupMicrosoftOAuth=true."
          fi

      - name: Run database migrations (ECS one-off task)
        run: bash scripts/ecs-run-migrations.sh SkoutDev

      - name: Run Email Intelligence database migrations (ECS one-off task)
        run: bash scripts/ecs-run-email-intel-migrations.sh SkoutDev

      - name: Run Warm-Up Tool database migrations (ECS one-off task)
        run: bash scripts/ecs-run-warmup-tool-migrations.sh SkoutDev

      - name: Force ECS redeploy
        run: |
          CLUSTER=$(aws ecs list-clusters --query "clusterArns[?contains(@, 'SkoutDev')]" --output text)
          for svc in api crm ai web scraper-orchestrator scraper-cleaner scraper-ingestor email-intel-api email-intel-worker warmup-tool-api warmup-tool-worker warmup-tool-inbound warmup-tool-classification warmup-tool-policy; do
            aws ecs update-service --cluster "$CLUSTER" --service "$svc" --force-new-deployment || true
          done
