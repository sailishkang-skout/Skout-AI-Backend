services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skout
      POSTGRES_PASSWORD: skout
      POSTGRES_DB: skout
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skout"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Uncomment when staging search/analytics infra is provisioned
  # opensearch:
  #   image: opensearchproject/opensearch:2.11.0
  #   environment:
  #     discovery.type: single-node
  #     DISABLE_SECURITY_PLUGIN: "true"
  #   ports:
  #     - "9200:9200"

volumes:
  postgres-data:
