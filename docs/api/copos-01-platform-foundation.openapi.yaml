openapi: 3.1.0
info:
  title: Skout CustomerOps — Platform Foundation (COPS-01)
  version: 0.1.0-draft
  description: |
    Contract-first draft for COPS-01. Covers the shared platform surface that every
    CustomerOps ticket depends on: error envelope, idempotency keys, permission-denied
    responses, rate-limit metadata, and the versioned event envelope.

    Draft contract for the shared foundation plus the implemented audit and replay
    endpoints. Lifecycle-specific endpoints remain owned by their capability tickets.
servers:
  - url: /api/v1
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key for safe retries of unsafe methods. Same key + same body
        returns the original response. Same key + different body returns 422.
        Keys are scoped to the workspace and expire after 24h.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          description: Stable machine-readable code (e.g. FORBIDDEN, BUSINESS_STATE_CONFLICT).
          examples: [FORBIDDEN, VALIDATION_FAILED, BUSINESS_STATE_CONFLICT, RATE_LIMITED, IDEMPOTENCY_KEY_REUSED]
        message:
          type: string
          description: Human-readable message. Never contains SQL or stack traces.
        details:
          type: object
          additionalProperties: true
          description: Code-specific detail (see per-status schemas below).
        request_id:
          type: string
        retryable:
          type: boolean
    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          description: JSON-pointer-like field path, e.g. "contacts[2].email".
          examples: ["contacts[2].email"]
        code:
          type: string
        message:
          type: string
    ValidationErrorDetails:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    ConflictErrorDetails:
      type: object
      description: 409 — the request is valid but conflicts with current business state.
      required: [current_state]
      properties:
        current_state:
          type: object
          additionalProperties: true
        allowed_transitions:
          type: array
          items:
            type: string
    PermissionErrorDetails:
      type: object
      required: [required_permission]
      properties:
        required_permission:
          type: string
          examples: ["team:manage"]
    RateLimitErrorDetails:
      type: object
      required: [retry_after_seconds]
      properties:
        retry_after_seconds:
          type: integer
          minimum: 0
        limit:
          type: integer
        window_seconds:
          type: integer
    EventEnvelope:
      type: object
      description: |
        Versioned event envelope. Same shape is used for outbox rows, BullMQ payloads,
        outbound webhooks and SSE. Consumers must reject unknown schema_version values.
      required:
        - event_id
        - event_type
        - schema_version
        - tenant_id
        - aggregate_type
        - aggregate_id
        - occurred_at
        - actor
        - correlation_id
        - payload
      properties:
        event_id:
          type: string
          format: uuid
          description: Stable identity. Used for consumer idempotency and dedup.
        event_type:
          type: string
          pattern: "^[A-Z][A-Za-z]*$"
          examples: ["OpportunityQualified", "PaymentSucceeded"]
        schema_version:
          type: integer
          const: 1
          description: Major version only. Currently 1. Consumers reject unknown values.
        tenant_id:
          type: string
        aggregate_type:
          type: string
        aggregate_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [user, system, ai, integration]
            id:
              type: [string, "null"]
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: [string, "null"]
          format: uuid
        payload:
          type: object
          additionalProperties: true
  responses:
    ValidationFailed:
      description: 422 — request body or params are well-formed but fail business validation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  details:
                    $ref: "#/components/schemas/ValidationErrorDetails"
    Conflict:
      description: 409 — current business state does not allow this operation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  details:
                    $ref: "#/components/schemas/ConflictErrorDetails"
    Forbidden:
      description: 403 — caller lacks the required permission.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  details:
                    $ref: "#/components/schemas/PermissionErrorDetails"
    RateLimited:
      description: 429 — retry after the indicated delay.
      headers:
        Retry-After:
          description: Seconds until the caller may retry.
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  details:
                    $ref: "#/components/schemas/RateLimitErrorDetails"
paths:
  /cops/lifecycle/{dimension}/{entityId}/transitions:
    post:
      summary: Apply an audited lifecycle transition
      description: |
        Requires write permission for the selected dimension. State, audit entry and
        LifecycleTransitioned outbox event are committed atomically. A disallowed transition
        returns 409 BUSINESS_STATE_CONFLICT.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: dimension
          in: path
          required: true
          schema:
            type: string
            enum: [opportunity, commercial, onboarding, account, health, support]
        - name: entityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, source, reason]
              additionalProperties: false
              properties:
                to: { type: string }
                source: { type: string, minLength: 1, maxLength: 100 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Transition committed with its audit and outbox event.
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /cops/audit:
    get:
      summary: Read the current workspace audit log
      description: Requires admin:read. Results are newest-first and use an opaque keyset cursor.
      parameters:
        - name: search
          in: query
          description: Case-insensitive search across actor name/email, action, entity type/reference, and reason.
          schema: { type: string, maxLength: 120 }
        - name: actor_id
          in: query
          schema: { type: string }
        - name: entity_type
          in: query
          schema: { type: string }
        - name: entity_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Workspace-scoped audit entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  next_cursor:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /cops/events/replay:
    post:
      summary: Replay outbox events
      description: Requires admin:admin and a non-empty reason. Replay is audited and tenant-scoped.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                event_ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, format: uuid }
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                reason:
                  type: string
                  minLength: 8
                  maxLength: 500
              description: Provide event_ids or both from and to, never both.
      responses:
        "200":
          description: Events queued for relay.
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    type: object
                    required: [replayed, truncated, event_ids]
                    properties:
                      replayed: { type: integer, minimum: 0 }
                      truncated: { type: boolean }
                      event_ids:
                        type: array
                        items: { type: string, format: uuid }
                  request_id: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
