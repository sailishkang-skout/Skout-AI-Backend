openapi: 3.0.3
info:
  title: Skout CustomerOps COPS-02 - Internal CRM, Customer 360, Timeline
  version: 0.1.0-draft
  description: |
    Contract-first draft for COPS-02. Implements on top of the COPS-01 platform foundation
    (error envelope, idempotency keys, lifecycle transitions, audit, outbox).
    Existing CRM tables are reused: companies (Account), deals (Opportunity), pipelines,
    pipelineStages (Stage), tasks, activities, meetings, crmNativeLinks (external references).
    Status: draft, pending reviewer sign-off (Aditya).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Fields:
      name: fields
      in: query
      description: Comma-separated field selection, e.g. header,contacts,risks.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 200 }
  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message, request_id, retryable]
      properties:
        code: { type: string, example: BUSINESS_STATE_CONFLICT }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        request_id: { type: string, format: uuid }
        retryable: { type: boolean }
    FieldErrors:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            details:
              type: object
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required: [path, code, message]
                    properties:
                      path: { type: string, example: "contacts[0].email" }
                      code: { type: string }
                      message: { type: string }
    Provenance:
      type: object
      description: Where a value came from. Enriched or inferred values never overwrite a verified value.
      required: [source, confidence, verified]
      properties:
        source: { type: string, enum: [user, import, enrichment, crm_sync, inferred] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        verified: { type: boolean }
        observed_at: { type: string, format: date-time }
    Account:
      type: object
      required: [id, name, owner_id, created_at]
      properties:
        id: { type: string, format: uuid, description: Immutable Skout ID }
        name: { type: string }
        domain: { type: string, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
        lifecycle: { type: object, description: Snapshot of COPS-01 lifecycle dimensions }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Contact:
      type: object
      required: [id, account_id, full_name]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string, format: email, nullable: true }
        email_provenance: { $ref: '#/components/schemas/Provenance' }
        suppressed: { type: boolean }
        bounce_status: { type: string, enum: [none, soft, hard] }
    Opportunity:
      type: object
      required: [id, account_id, pipeline_id, stage_id, state]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        pipeline_id: { type: string, format: uuid }
        stage_id: { type: string, format: uuid }
        state: { type: string, enum: [qualified, demo, commercial, won, lost] }
        value: { type: number, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
    Task:
      type: object
      required: [id, type, title, status]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [call, email, meeting, review, approval, onboarding_check, renewal, ticket_follow_up]
        title: { type: string }
        status: { type: string, enum: [open, completed] }
        due_at: { type: string, format: date-time, nullable: true }
        account_id: { type: string, format: uuid, nullable: true }
    TimelineEvent:
      type: object
      required: [id, type, occurred_at, actor, source_event_id, visibility]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [email, call, meeting, note, proposal, contract, payment, provisioning, product_milestone, ticket, workflow_action]
        occurred_at: { type: string, format: date-time }
        actor:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [user, system, ai, integration] }
            id: { type: string, nullable: true }
        source_event_id: { type: string, format: uuid, nullable: true }
        visibility: { type: string, enum: [public, internal], description: Internal items require the crm:read-internal permission. }
        summary: { type: string }
    Account360:
      type: object
      description: Header plus summary blocks. Returned in one request, field-selectable.
      properties:
        header:
          type: object
          properties:
            name: { type: string }
            owner_id: { type: string, nullable: true }
            lifecycle: { type: object }
            health: { type: string, nullable: true }
            commercial_state: { type: string, nullable: true }
            onboarding_pct: { type: number, nullable: true, minimum: 0, maximum: 100 }
            plan: { type: string, nullable: true }
            renewal_at: { type: string, format: date-time, nullable: true }
        contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
        commercial: { type: object, additionalProperties: true }
        onboarding: { type: object, additionalProperties: true }
        tickets: { type: array, items: { type: object, additionalProperties: true } }
        next_actions: { type: array, items: { $ref: '#/components/schemas/Task' } }
        risks: { type: array, items: { type: object, additionalProperties: true } }
    SavedView:
      type: object
      required: [id, name, object, filters]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        object: { type: string, enum: [account, contact, opportunity, task] }
        filters: { type: object, additionalProperties: true }
        sort: { type: string, example: "-updated_at" }
        shared: { type: boolean }
    MergeRequest:
      type: object
      required: [survivor_id, duplicate_id, reason]
      properties:
        survivor_id: { type: string, format: uuid }
        duplicate_id: { type: string, format: uuid }
        reason: { type: string, minLength: 8, maxLength: 500 }
    MergeResult:
      type: object
      required: [status, conflicts]
      properties:
        status: { type: string, enum: [merged, review_required] }
        conflicts:
          type: array
          items:
            type: object
            required: [field, survivor_value, duplicate_value]
            properties:
              field: { type: string }
              survivor_value: {}
              duplicate_value: {}
paths:
  /accounts/{id}/360:
    get:
      summary: Customer 360 header and summary blocks (single request, no N+1)
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: Account 360
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Account360' }
        '403': { description: Permission denied, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: Account not found in this tenant, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /accounts/{id}/timeline:
    get:
      summary: Cursor-paginated timeline with type filter
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: false
      responses:
        '200':
          description: Timeline page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }
                  next_cursor: { type: string, nullable: true }
  /tasks/{id}/complete:
    post:
      summary: Complete a task; emits TaskCompleted through the outbox
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Task' }
        '409':
          description: Task already completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /opportunities/{id}/stage:
    post:
      summary: Move an opportunity to a stage via the lifecycle transition service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage_id, reason]
              properties:
                stage_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Stage changed }
        '409':
          description: Illegal stage transition (BUSINESS_STATE_CONFLICT) with allowed_transitions in details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: Validation with field paths
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldErrors' }
  /saved-views:
    get:
      summary: List saved views visible to the caller
      parameters:
        - name: object
          in: query
          schema: { type: string, enum: [account, contact, opportunity, task] }
      responses:
        '200': { description: Saved views }
    post:
      summary: Create a saved view
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedView' }
      responses:
        '201': { description: Created }
        '422':
          description: Validation with field paths
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldErrors' }
  /accounts/merge:
    post:
      summary: Merge a duplicate account into a survivor; conflicts go to review
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeRequest' }
      responses:
        '200':
          description: Merge result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MergeResult' }
        '409':
          description: Account already merged or merge in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /tasks/bulk-reassign:
    post:
      summary: Reassign many tasks or accounts to one owner (permissioned, audited)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, owner_id, reason]
              properties:
                ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
                owner_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Reassigned count }
        '403': { description: Permission denied, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
