<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skout AI</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="side-panel">
    <header>
      <h1>Skout AI</h1>
      <p>Stays open while you browse · use the LinkedIn sidebar on profiles</p>
    </header>

    <section class="card auth-card">
      <p id="auth-status" class="auth-status">Checking sign-in…</p>
      <button id="connect-skout" type="button" class="primary">Connect Skout account</button>
    </section>

    <section class="card">
      <label for="list-select">Target list</label>
      <select id="list-select">
        <option value="">Loading lists…</option>
      </select>
      <button id="refresh-lists" type="button">Refresh lists</button>
    </section>

    <section class="card actions">
      <button id="add-to-list" type="button" class="primary">Add current profile to list</button>
      <button id="enrich-profile" type="button">Enrich contact</button>
      <button id="score-profile" type="button">Score ICP</button>
    </section>

    <section class="card" id="sequence-section">
      <label for="sequence-select">Enroll in sequence</label>
      <select id="sequence-select">
        <option value="">Loading sequences…</option>
      </select>
      <p id="hitl-warning" class="hitl-warning hidden" role="alert">
        ⚠ Low-confidence ICP score — this prospect is flagged for human review. Click Enroll again to confirm.
      </p>
      <button id="enroll-sequence" type="button" class="primary">Enroll in sequence</button>
      <button id="refresh-sequences" type="button">Refresh sequences</button>
      <p id="enroll-confirm" class="enroll-confirm hidden">
        Enrolled! <a id="enroll-confirm-link" href="#" target="_blank" rel="noopener">View sequence →</a>
      </p>
    </section>

    <details id="dev-settings" class="dev-details">
      <summary>Developer settings</summary>
      <label for="api-url">API URL</label>
      <input id="api-url" type="url" placeholder="http://localhost:3001" />
      <label for="web-url">Skout web URL</label>
      <input id="web-url" type="url" placeholder="http://localhost:3000" />
      <label for="stub-email">Stub user email</label>
      <input id="stub-email" type="email" placeholder="extension@example.com" />
      <label class="checkbox-row">
        <input id="use-stub-auth" type="checkbox" />
        Use stub auth (AUTH_STUB=true only)
      </label>
      <button id="save-config" type="button">Save settings</button>
      <button id="reconnect-skout" type="button">Reconnect Skout account</button>
    </details>

    <p id="status" role="status" aria-live="polite"></p>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
